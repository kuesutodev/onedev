<wicket:extend>
    <script src="https://bundle.run/bs58@4.0.1"></script>
    <style>
        .solana-container {
            max-width: 400px;
            margin: 30px auto;
        }
        .wallet-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #9945FF 0%, #14F195 100%);
            color: white;
            border: none;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 20px;
        }
        .wallet-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(153, 69, 255, 0.4);
        }
        .wallet-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .wallet-btn .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 24px;
            line-height: 1;
            min-width: 24px;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        .status.info {
            background: #e3f2fd;
            color: #1565c0;
        }
        .status.error {
            background: #ffebee;
            color: #c62828;
        }
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .hidden {
            display: none;
        }
        .address-display {
            margin-top: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            word-break: break-all;
        }
        .cancel-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }
        .cancel-link:hover {
            text-decoration: underline;
        }
    </style>

    <div class="solana-container">
        <button id="connectBtn" class="wallet-btn">
            <span class="icon">👻</span>
            <span>Connect Phantom</span>
        </button>
        
        <div id="addressDisplay" class="address-display hidden"></div>
        
        <div id="status" class="status hidden"></div>
        
        <!-- Hidden form to POST credentials back to OneDev -->
        <form id="callbackForm" method="POST" wicket:id="callbackForm">
            <input type="hidden" name="message" id="messageInput">
            <input type="hidden" name="signature" id="signatureInput">
            <input type="hidden" name="address" id="addressInput">
        </form>
        
        <!-- Hidden spans for Wicket to inject values -->
        <span wicket:id="nonce" id="cfg-nonce" class="hidden"></span>
        <span wicket:id="statement" id="cfg-statement" class="hidden"></span>
        <span wicket:id="domain" id="cfg-domain" class="hidden"></span>
        <span wicket:id="uri" id="cfg-uri" class="hidden"></span>
        <span wicket:id="callbackUrl" id="cfg-callbackUrl" class="hidden"></span>
        <span wicket:id="expiration" id="cfg-expiration" class="hidden"></span>
        
        <a href="javascript:history.back()" class="cancel-link">Cancel and go back</a>
    </div>
    
    <script>
        (function() {
            // Use the bs58 library loaded from CDN for reliable Base58 encoding
            // The library is available as window.bs58
            
            // Read configuration from hidden spans
            function getConfig() {
                return {
                    nonce: document.getElementById('cfg-nonce').textContent,
                    statement: document.getElementById('cfg-statement').textContent,
                    domain: document.getElementById('cfg-domain').textContent,
                    uri: document.getElementById('cfg-uri').textContent,
                    callbackUrl: document.getElementById('cfg-callbackUrl').textContent,
                    expirationSeconds: parseInt(document.getElementById('cfg-expiration').textContent) || 300
                };
            }
        
            function showStatus(message, type) {
                var status = document.getElementById('status');
                status.textContent = message;
                status.className = 'status ' + type;
                status.classList.remove('hidden');
            }
        
            function hideStatus() {
                document.getElementById('status').classList.add('hidden');
            }
        
            function setButtonState(text, disabled) {
                var btn = document.getElementById('connectBtn');
                btn.querySelector('span:last-child').textContent = text;
                btn.disabled = disabled;
            }
        
            function showAddress(address) {
                var display = document.getElementById('addressDisplay');
                display.textContent = address;
                display.classList.remove('hidden');
            }
            
            /**
             * Gets the Solana provider (Phantom, Solflare, etc.)
             */
            function getProvider() {
                if ('phantom' in window) {
                    const provider = window.phantom?.solana;
                    if (provider?.isPhantom) {
                        return provider;
                    }
                }
                if ('solana' in window) {
                    return window.solana;
                }
                return null;
            }

            /**
             * Builds a SIWS message following the Sign-In with Solana format
             */
            function buildSiwsMessage(address, chainId, config) {
                var now = new Date();
                var expiration = new Date(now.getTime() + config.expirationSeconds * 1000);
            
                return config.domain + ' wants you to sign in with your Solana account:\n' +
                    address + '\n\n' +
                    config.statement + '\n\n' +
                    'URI: ' + config.uri + '\n' +
                    'Version: 1\n' +
                    'Chain ID: ' + chainId + '\n' +
                    'Nonce: ' + config.nonce + '\n' +
                    'Issued At: ' + now.toISOString() + '\n' +
                    'Expiration Time: ' + expiration.toISOString();
            }
        
            /**
             * Main function to connect wallet and sign SIWS message
             */
            async function connectAndSign() {
                hideStatus();
                var config = getConfig();
                
                try {
                    // Check for Solana provider
                    var provider = getProvider();
                    if (!provider) {
                        showStatus('No Solana wallet detected. Please install Phantom or another Solana wallet.', 'error');
                        return;
                    }
                    
                    setButtonState('Connecting...', true);
                    showStatus('Requesting wallet connection...', 'info');
                    
                    // Connect to wallet
                    const resp = await provider.connect();
                    const publicKey = resp.publicKey;
                    const address = publicKey.toString();
                    
                    // Show connected address
                    showAddress(address);
                    
                    // Determine chain ID (Phantom doesn't expose this directly, use mainnet as default)
                    var chainId = 'mainnet';
                    
                    setButtonState('Signing...', true);
                    showStatus('Please sign the message in your wallet...', 'info');
                    
                    // Build SIWS message
                    var message = buildSiwsMessage(address, chainId, config);
                    
                    // Request signature - Solana wallets sign raw bytes
                    const encodedMessage = new TextEncoder().encode(message);
                    const signedMessage = await provider.signMessage(encodedMessage, 'utf8');
                    
                    // Encode signature to Base58 using the bs58 library
                    const signatureBase58 = bs58.encode(new Uint8Array(signedMessage.signature));
                    
                    setButtonState('Verifying...', true);
                    showStatus('Verifying signature...', 'success');
                    
                    // Submit to server
                    document.getElementById('messageInput').value = message;
                    document.getElementById('signatureInput').value = signatureBase58;
                    document.getElementById('addressInput').value = address;
                    
                    // Update form action and submit
                    var form = document.getElementById('callbackForm');
                    form.action = config.callbackUrl;
                    form.submit();
                    
                } catch (error) {
                    console.error('Solana authentication error:', error);
                    setButtonState('Connect Phantom', false);
                    
                    // Handle specific error cases
                    if (error.code === 4001) {
                        showStatus('Connection request was rejected. Please try again.', 'error');
                    } else if (error.message && error.message.includes('User rejected')) {
                        showStatus('Signature request was rejected. Please try again.', 'error');
                    } else {
                        showStatus(error.message || 'An error occurred. Please try again.', 'error');
                    }
                }
            }
        
            // Check for existing connection
            async function checkExistingConnection() {
                var provider = getProvider();
                if (provider) {
                    try {
                        // Check if already connected
                        if (provider.isConnected) {
                            showStatus('Wallet detected. Click the button to sign in.', 'info');
                        }
                    } catch (e) {
                        // Ignore errors during initial check
                    }
                }
            }
        
            // Handle account changes
            function setupAccountChangeListener() {
                var provider = getProvider();
                if (provider) {
                    provider.on('disconnect', function() {
                        hideStatus();
                        document.getElementById('addressDisplay').classList.add('hidden');
                        setButtonState('Connect Phantom', false);
                    });
                }
            }
        
            // Initialize when DOM is ready
            function init() {
                // Attach click handler to button
                document.getElementById('connectBtn').addEventListener('click', connectAndSign);
                
                // Setup listeners and check for existing connection
                setupAccountChangeListener();
                checkExistingConnection();
            }
            
            // Run init when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</wicket:extend>
